<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found — KC Marshall</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #F5F1EB; color: #1F1C19;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; padding: 40px 24px; }
  .num {
    font-family: 'Archivo', system-ui, sans-serif; font-stretch: 125%;
    font-size: clamp(96px, 18vw, 160px); font-weight: 800; line-height: 1;
    color: #8A7F73; margin-bottom: 20px;
  }
  h1 {
    font-family: 'Archivo', system-ui, sans-serif; font-stretch: 125%;
    font-size: 28px; font-weight: 800; text-transform: uppercase; margin-bottom: 12px;
  }
  p  { font-size: 16px; color: #5C544B; line-height: 1.7; margin-bottom: 32px; }
  a  {
    display: inline-flex; align-items: center; gap: 8px; min-height: 52px;
    background: #1F1C19; color: #F5F1EB;
    padding: 0 24px; border-radius: 14px;
    font-weight: 600; font-size: 15px; text-decoration: none;
  }
  a:hover { background: #3F5E74; }
  a:focus-visible { outline: 2px solid #3F5E74; outline-offset: 3px; }
  a::after { content: '→'; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="num">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Head back to the homepage to find what you need.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
