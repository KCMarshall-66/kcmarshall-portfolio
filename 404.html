<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found — KC Marshall</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0c0e; --accent: #5de8b8;
    --text: #f0f0ee; --text-mid: rgba(240,240,238,0.5);
    --border: rgba(255,255,255,0.07);
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; padding: 40px 24px; }
  .num {
    font-size: 96px; font-weight: 800; letter-spacing: -4px;
    color: var(--accent); line-height: 1; margin-bottom: 16px;
    opacity: 0.4;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }
  p  { font-size: 15px; color: var(--text-mid); line-height: 1.7; margin-bottom: 32px; }
  a  {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--bg);
    padding: 12px 24px; border-radius: 8px;
    font-weight: 700; font-size: 14px; text-decoration: none;
  }
  a::after { content: '→'; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="num">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Head back to the homepage to find what you need.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
