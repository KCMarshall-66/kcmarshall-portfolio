<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regulatory Alignment Heatmap — Privacy Posture Management</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f9f9f7; color: #2C2C2A; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 500; color: #1D5BA6; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #888780; margin: 0 0 20px; }
  .hm-wrap { overflow-x: auto; padding: 4px 0 16px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; min-width: 580px; }
  th, td { padding: 0; }
  .col-label { font-size: 11px; font-weight: 500; color: #5F5E5A; text-align: center; padding: 6px 4px; line-height: 1.3; vertical-align: bottom; }
  .row-label { font-size: 12px; color: #2C2C2A; padding: 4px 10px 4px 0; white-space: nowrap; vertical-align: middle; }
  .cell { width: 100%; height: 38px; border-radius: 4px; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; margin: 2px; }
  .cell:hover { opacity: 0.78; }
  td.cell-td { padding: 2px; }
  .score-full  { background: #1D9E75; color: #085041; }
  .score-high  { background: #5DCAA5; color: #085041; }
  .score-mid   { background: #EF9F27; color: #633806; }
  .score-low   { background: #F09595; color: #791F1F; }
  .score-none  { background: #F7C1C1; color: #791F1F; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px; color: #5F5E5A; align-items: center; }
  .leg-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
  .tooltip { position: fixed; background: #fff; border: 0.5px solid #B4B2A9; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #2C2C2A; pointer-events: none; max-width: 260px; line-height: 1.5; z-index: 100; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filter-btn { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid #B4B2A9; background: transparent; color: #5F5E5A; cursor: pointer; transition: background 0.1s; font-family: Arial, sans-serif; }
  .filter-btn.active { background: #F1EFE8; color: #2C2C2A; border-color: #888780; }
  .filter-btn:hover { background: #F1EFE8; }
  .watermark { font-size: 11px; color: #B4B2A9; margin-top: 16px; }
</style>
</head>
<body>

<h1>Regulatory alignment heatmap</h1>
<p class="subtitle">Privacy Posture Management — coverage scores by domain and framework</p>

<div class="tooltip" id="tip"></div>

<div class="filter-row" id="filter-row"></div>

<div class="legend">
  <span style="font-size: 12px; color: #5F5E5A; margin-right: 4px;">Coverage:</span>
  <span style="display:flex;align-items:center;gap:4px"><span class="leg-swatch" style="background:#1D9E75"></span>Full (90–100%)</span>
  <span style="display:flex;align-items:center;gap:4px"><span class="leg-swatch" style="background:#5DCAA5"></span>High (70–89%)</span>
  <span style="display:flex;align-items:center;gap:4px"><span class="leg-swatch" style="background:#EF9F27"></span>Partial (40–69%)</span>
  <span style="display:flex;align-items:center;gap:4px"><span class="leg-swatch" style="background:#F09595"></span>Low (10–39%)</span>
  <span style="display:flex;align-items:center;gap:4px"><span class="leg-swatch" style="background:#F7C1C1"></span>Gap (&lt;10%)</span>
</div>

<div class="hm-wrap">
  <table id="heatmap"></table>
</div>

<p class="watermark">Generated April 2026 — Privacy Posture Management program</p>

<script>
const regs = [
  { id: 'gdpr',  label: 'GDPR',      region: 'EU'     },
  { id: 'ccpa',  label: 'CCPA/CPRA', region: 'US'     },
  { id: 'hipaa', label: 'HIPAA',     region: 'US'     },
  { id: 'lgpd',  label: 'LGPD',      region: 'LATAM'  },
  { id: 'pdpa',  label: 'PDPA',      region: 'APAC'   },
  { id: 'iso',   label: 'ISO 27701', region: 'Global' },
  { id: 'nist',  label: 'NIST PF',   region: 'Global' },
];

const domains = [
  { id: 'inventory', label: 'Data inventory\n& mapping',
    scores: { gdpr:92, ccpa:88, hipaa:70, lgpd:75, pdpa:65, iso:90, nist:85 },
    notes: { gdpr:'Art. 30 records of processing — strong coverage', ccpa:'Data inventory supports consumer rights', hipaa:'PHI systems mapped, some gaps in shadow IT', lgpd:'Art. 37 controller obligations partially met', pdpa:'Data mapping underway, 65% complete', iso:'Annex A control 8.1 well-documented', nist:'Identify function well-supported' } },
  { id: 'consent', label: 'Consent\nmanagement',
    scores: { gdpr:85, ccpa:90, hipaa:55, lgpd:80, pdpa:60, iso:72, nist:65 },
    notes: { gdpr:'Consent banners deployed, granular purposes in progress', ccpa:'Opt-out flows implemented, CPRA updates done', hipaa:'Authorization forms present, digital gap', lgpd:'Consent records captured for most channels', pdpa:'Opt-in model partially implemented', iso:'Privacy notice controls documented', nist:'Consent aligns with Govern function' } },
  { id: 'dsr', label: 'Data subject\nrights (DSR)',
    scores: { gdpr:88, ccpa:92, hipaa:45, lgpd:60, pdpa:50, iso:78, nist:70 },
    notes: { gdpr:'DSAR workflow automated, 96% on-time', ccpa:'Consumer requests handled, CPRA timing met', hipaa:'Access requests manual, no deletion right', lgpd:'Arts. 17–22 rights partially automated', pdpa:'Right of access implemented, others pending', iso:'Subject access process documented', nist:'Respond function partially addressed' } },
  { id: 'retention', label: 'Retention &\ndeletion',
    scores: { gdpr:54, ccpa:60, hipaa:78, lgpd:42, pdpa:35, iso:65, nist:58 },
    notes: { gdpr:'Schedules defined but only 54% enforced in systems', ccpa:'Deletion processes defined, technical enforcement gaps', hipaa:'6-year retention rule enforced in EHR, others lag', lgpd:'Retention policies documented, enforcement weak', pdpa:'Retention schedules not yet technically enforced', iso:'Control 8.10 partially implemented', nist:'Protect function has enforcement gaps' } },
  { id: 'vendor', label: 'Third-party\nrisk',
    scores: { gdpr:70, ccpa:65, hipaa:82, lgpd:50, pdpa:40, iso:75, nist:68 },
    notes: { gdpr:'DPAs in place for 70% of processors', ccpa:'Service provider agreements updated for CPRA', hipaa:'BAAs in place for most vendors', lgpd:'Third-party risk assessments incomplete', pdpa:'Vendor assessments at 40%', iso:'Supplier relationships documented', nist:'Vendor risk integrated into Govern function' } },
  { id: 'breach', label: 'Breach\nnotification',
    scores: { gdpr:90, ccpa:78, hipaa:95, lgpd:65, pdpa:55, iso:88, nist:82 },
    notes: { gdpr:'72-hour notification process fully operational', ccpa:'Breach response plan current', hipaa:'HIPAA breach rule fully implemented', lgpd:'Notification process defined, untested', pdpa:'Incident response plan in draft', iso:'Incident management integrated', nist:'Respond function well-covered' } },
  { id: 'pia', label: 'Privacy impact\nassessments',
    scores: { gdpr:78, ccpa:55, hipaa:62, lgpd:58, pdpa:48, iso:80, nist:74 },
    notes: { gdpr:'DPIAs triggered for high-risk processing', ccpa:'Risk assessments required for sensitive data uses', hipaa:'Security risk analysis present, privacy PIA partial', lgpd:'Art. 38 PIA process defined, 58% complete', pdpa:'DPIA required for sensitive data, partially implemented', iso:'Privacy impact assessment process documented', nist:'Identify function supported by PIA workflow' } },
];

function scoreClass(s) {
  if (s >= 90) return 'score-full';
  if (s >= 70) return 'score-high';
  if (s >= 40) return 'score-mid';
  if (s >= 10) return 'score-low';
  return 'score-none';
}

function avgScore(domain, filter) {
  const ids = filter === 'all' ? regs.map(r => r.id) : regs.filter(r => r.region === filter).map(r => r.id);
  if (!ids.length) return 0;
  return Math.round(ids.reduce((s, id) => s + (domain.scores[id] || 0), 0) / ids.length);
}

let activeFilter = 'all';
const filters = ['all', 'EU', 'US', 'LATAM', 'APAC', 'Global'];
const filterRow = document.getElementById('filter-row');
filters.forEach(f => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (f === 'all' ? ' active' : '');
  btn.textContent = f === 'all' ? 'All regions' : f;
  btn.onclick = () => {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
  filterRow.appendChild(btn);
});

const tip = document.getElementById('tip');

function render() {
  const visRegs = activeFilter === 'all' ? regs : regs.filter(r => r.region === activeFilter);
  const table = document.getElementById('heatmap');
  table.innerHTML = '';

  let thead = '<thead><tr><th style="width:140px"></th>';
  visRegs.forEach(r => {
    thead += `<th class="col-label">${r.label}<br><span style="font-size:10px;color:#888780">${r.region}</span></th>`;
  });
  thead += '<th class="col-label" style="width:52px">Avg</th></tr></thead>';
  table.innerHTML = thead;

  const tbody = document.createElement('tbody');
  domains.forEach(domain => {
    const tr = document.createElement('tr');
    const avg = avgScore(domain, activeFilter);
    const labelLines = domain.label.split('\n');
    let rowHTML = `<td class="row-label">${labelLines.join('<br>')}</td>`;
    visRegs.forEach(r => {
      const s = domain.scores[r.id] || 0;
      const cls = scoreClass(s);
      rowHTML += `<td class="cell-td"><div class="cell ${cls}" data-reg="${r.label}" data-dom="${domain.label.replace('\n',' ')}" data-score="${s}%" data-note="${domain.notes[r.id] || ''}">${s}%</div></td>`;
    });
    const avgCls = scoreClass(avg);
    rowHTML += `<td class="cell-td"><div class="cell ${avgCls}" style="font-weight:500">${avg}%</div></td>`;
    tr.innerHTML = rowHTML;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  document.querySelectorAll('.cell[data-reg]').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tip.innerHTML = `<span style="font-weight:500;color:#2C2C2A">${el.dataset.reg} — ${el.dataset.dom}</span><br><span style="color:#5F5E5A">${el.dataset.score} alignment</span>${el.dataset.note ? '<br><span style="color:#888780;font-size:11px;margin-top:4px;display:block">'+el.dataset.note+'</span>' : ''}`;
      tip.style.display = 'block';
    });
    el.addEventListener('mousemove', e => {
      tip.style.top  = (e.clientY + 14) + 'px';
      tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 280) + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

render();
</script>
</body>
</html>
